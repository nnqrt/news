name: Sync OSINT Archive Manifest

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'legacy/index_*.html'
      - 'scripts/build_archive.py'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild archive manifest and wire archive.js
        run: python scripts/build_archive.py
      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html legacy/editions.json legacy/index_*.html
            git commit -m "chore: sync archive manifest and wire archive.js"
            git push
          fi
